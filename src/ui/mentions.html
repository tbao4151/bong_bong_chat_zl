<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Tin nhắc tên tôi</title>
<style>
  html, body { margin: 0; height: 100%; background: #FFFFFF; color: #1B2229; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
  body { display: flex; flex-direction: column; border: 1px solid #CBD3DA; box-sizing: border-box; }
  header {
    height: 52px; flex-shrink: 0; background: #0A5BD6; color: #FFFFFF; display: flex; align-items: center;
    gap: 10px; padding: 0 4px 0 12px; -webkit-app-region: drag; user-select: none;
  }
  .at {
    width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; color: #0A5BD6;
    font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .info { flex: 1; display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .info b { font-size: 15px; }
  #sub { font-size: 12px; color: #DCE8FF; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #FFB547; outline-offset: -2px; }
  #x {
    -webkit-app-region: no-drag; width: 36px; height: 36px; border: none; border-radius: 8px;
    background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center;
  }
  #x:hover { background: rgba(255, 255, 255, 0.16); }
  .tabs { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid #E3E7EB; flex-shrink: 0; }
  .tabs button {
    flex: 1; height: 32px; border: 1px solid #CBD3DA; background: #FFFFFF; color: #3D4852; border-radius: 16px; font-weight: 600; font-size: 13px;
  }
  .tabs button[aria-selected=true] { background: #0A5BD6; border-color: #0A5BD6; color: #FFFFFF; }
  #list { flex: 1; overflow-y: auto; }
  .day { position: sticky; top: 0; background: #EEF1F4; color: #3D4852; font-size: 12px; font-weight: 600; padding: 5px 14px; }
  .item {
    display: grid; grid-template-columns: 10px 1fr auto; column-gap: 10px; width: 100%; text-align: left;
    border: none; border-bottom: 1px solid #F0F2F4; background: #FFFFFF; padding: 10px 14px; color: inherit;
  }
  .item:hover { background: #F2F7FF; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #0A5BD6; margin-top: 6px; }
  .seen .dot { background: transparent; }
  .main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .who { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seen .who { font-weight: 600; color: #3D4852; }
  .by { font-size: 12px; color: #8A4B08; }
  .text {
    font-size: 13px; color: #5B6670; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .time { font-size: 12px; color: #5B6670; white-space: nowrap; }
  .empty { padding: 40px 24px; text-align: center; color: #5B6670; line-height: 1.5; }
  .empty b { display: block; color: #1B2229; font-size: 15px; margin-bottom: 4px; }
  .link { border: none; background: none; color: #0A5BD6; font-weight: 600; padding: 4px; text-decoration: underline; }
  footer { flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #E3E7EB; }
  footer button {
    flex: 1; height: 36px; border-radius: 8px; border: 1px solid #CBD3DA; background: #FFFFFF; color: #1B2229; font-weight: 600; font-size: 13px;
  }
  footer button:hover { background: #F4F6F8; }
  #clear { color: #B42318; }
</style>
</head>
<body>
<header>
  <span class="at" aria-hidden="true">@</span>
  <div class="info"><b>Tin nhắc tên tôi</b><span id="sub"></span></div>
  <button id="x" aria-label="Đóng">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>
</header>
<div class="tabs" role="tablist">
  <button role="tab" id="tToday" aria-selected="true">Hôm nay</button>
  <button role="tab" id="tWeek" aria-selected="false">7 ngày qua</button>
</div>
<div id="list" role="list"></div>
<footer>
  <button id="seenAll">Đánh dấu đã xem hết</button>
  <button id="clear">Xóa danh sách</button>
</footer>
<script>
  const $ = (id) => document.getElementById(id);
  let tab = 'today';
  let data = { items: [], hasName: true };
  const DAYS = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];

  const pad = (n) => String(n).padStart(2, '0');
  const hm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  function dayLabel(d) {
    const diff = Math.round((startOfToday() - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
    if (diff === 0) return 'Hôm nay';
    if (diff === 1) return 'Hôm qua';
    return DAYS[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    const list = $('list');
    list.textContent = '';
    const today = startOfToday();
    const items = data.items.filter((m) => tab === 'week' || m.at >= today);
    const unseenToday = data.items.filter((m) => !m.seen && m.at >= today).length;
    const totalToday = data.items.filter((m) => m.at >= today).length;
    $('sub').textContent = totalToday
      ? 'Hôm nay: ' + totalToday + ' lần, ' + unseenToday + ' chưa xem'
      : 'Hôm nay chưa ai nhắc tên bạn';
    $('tToday').setAttribute('aria-selected', tab === 'today');
    $('tWeek').setAttribute('aria-selected', tab === 'week');

    if (!items.length) {
      const box = el('div', 'empty');
      box.appendChild(el('b', null, tab === 'today' ? 'Hôm nay chưa ai nhắc tên bạn' : 'Chưa có tin nhắc tên trong 7 ngày qua'));
      if (!data.hasName) {
        box.appendChild(el('span', null, 'App cần biết tên Zalo của bạn để nhận ra khi bạn được tag. '));
        const a = el('button', 'link', 'Mở Cài đặt');
        a.onclick = () => app.send('mentions:settings');
        box.appendChild(a);
      } else {
        box.appendChild(el('span', null, 'Khi có người @tag bạn, tin đó sẽ hiện ở đây.'));
      }
      list.appendChild(box);
      return;
    }

    let lastDay = '';
    items.forEach((m) => {
      const d = new Date(m.at);
      const label = dayLabel(d);
      if (tab === 'week' && label !== lastDay) { list.appendChild(el('div', 'day', label)); lastDay = label; }
      const b = el('button', 'item' + (m.seen ? ' seen' : ''));
      b.setAttribute('role', 'listitem');
      b.appendChild(el('span', 'dot'));
      const main = el('span', 'main');
      main.appendChild(el('span', 'who', m.group || m.sender));
      main.appendChild(el('span', 'by', m.group ? 'Người tag: ' + m.sender : 'Tin nhắn riêng'));
      if (m.text) main.appendChild(el('span', 'text', m.text));
      b.appendChild(main);
      b.appendChild(el('span', 'time', hm(d)));
      b.setAttribute('aria-label', (m.seen ? '' : 'Chưa xem. ') + (m.group || m.sender) + ', ' + (m.group ? 'người tag ' + m.sender + ', ' : '') + 'lúc ' + hm(d));
      b.onclick = () => app.send('mentions:open', m.id);
      list.appendChild(b);
    });
  }

  async function load() { data = await app.invoke('mentions:list'); render(); }

  $('tToday').onclick = () => { tab = 'today'; render(); };
  $('tWeek').onclick = () => { tab = 'week'; render(); };
  $('x').onclick = () => app.send('mentions:close');
  $('seenAll').onclick = () => app.send('mentions:seen-all');
  let clearArmed = null;
  $('clear').onclick = () => {
    if (clearArmed) { clearTimeout(clearArmed); clearArmed = null; $('clear').textContent = 'Xóa danh sách'; app.send('mentions:clear'); return; }
    $('clear').textContent = 'Bấm lần nữa để xóa';
    clearArmed = setTimeout(() => { clearArmed = null; $('clear').textContent = 'Xóa danh sách'; }, 3000);
  };
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') app.send('mentions:close'); });
  app.on('mentions:changed', load);
  load();
</script>
</body>
</html>
