<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Ghi chú lên ảnh</title>
<style>
  html, body { margin: 0; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: #1B2229; }
  body { display: flex; flex-direction: column; background: #2B343B; }
  .bar {
    flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #CBD3DA;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px;
  }
  .group { display: flex; align-items: center; gap: 2px; padding-right: 8px; margin-right: 2px; border-right: 1px solid #E3E7EB; }
  .group:last-of-type { border-right: none; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #0A5BD6; outline-offset: 1px; }
  .tool {
    height: 36px; min-width: 36px; padding: 0 8px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: #1B2229; display: flex; align-items: center; gap: 6px;
  }
  .tool:hover { background: #EEF1F4; }
  .tool[aria-pressed=true] { background: #E3EDFD; border-color: #0A5BD6; color: #0A5BD6; }
  .tool .lb { font-size: 12px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px #CBD3DA; padding: 0; }
  .sw[aria-pressed=true] { box-shadow: 0 0 0 2px #1B2229; }
  .wd { width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: transparent; display: flex; align-items: center; justify-content: center; }
  .wd:hover { background: #EEF1F4; }
  .wd[aria-pressed=true] { background: #E3EDFD; border-color: #0A5BD6; }
  .wd i { display: block; width: 18px; background: #1B2229; border-radius: 3px; }
  .spacer { flex: 1; }
  .act { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #CBD3DA; background: #FFFFFF; font-weight: 600; }
  .act:hover { background: #F4F6F8; }
  #send { background: #0A5BD6; border-color: #0A5BD6; color: #FFFFFF; }
  #send:hover { background: #0848A8; }
  .hint { flex-shrink: 0; color: #CBD3DA; font-size: 12px; padding: 6px 12px; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; overflow: hidden; }
  #wrap { position: relative; max-width: 100%; max-height: 100%; display: flex; }
  canvas { display: block; max-width: 100%; max-height: calc(100vh - 150px); background: #FFFFFF; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4); cursor: crosshair; touch-action: none; }
  #txt {
    position: absolute; display: none; border: 1px dashed #0A5BD6; background: rgba(255, 255, 255, 0.85);
    font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; padding: 2px 4px; min-width: 120px; outline: none;
  }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Công cụ ghi chú">
  <div class="group" id="tools">
    <button class="tool" data-tool="arrow" title="Mũi tên (1)" aria-pressed="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L19 5"></path><path d="M10 5h9v9"></path></svg><span class="lb">Mũi tên</span></button>
    <button class="tool" data-tool="rect" title="Khung (2)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1"></rect></svg><span class="lb">Khung</span></button>
    <button class="tool" data-tool="ellipse" title="Khoanh tròn (3)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="6.5"></ellipse></svg><span class="lb">Khoanh</span></button>
    <button class="tool" data-tool="pen" title="Bút vẽ (4)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"></path></svg><span class="lb">Bút</span></button>
    <button class="tool" data-tool="mark" title="Bút dạ quang (5)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 18h16" stroke-width="5" opacity=".45"></path><path d="M9 14l7-7 2 2-7 7H9z"></path></svg><span class="lb">Tô sáng</span></button>
    <button class="tool" data-tool="text" title="Chữ (6)" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M12 6v13"></path></svg><span class="lb">Chữ</span></button>
  </div>
  <div class="group" id="colors">
    <button class="sw" data-color="#E5251B" style="background:#E5251B" title="Đỏ" aria-label="Màu đỏ" aria-pressed="true"></button>
    <button class="sw" data-color="#FFC21A" style="background:#FFC21A" title="Vàng" aria-label="Màu vàng" aria-pressed="false"></button>
    <button class="sw" data-color="#12A150" style="background:#12A150" title="Xanh lá" aria-label="Màu xanh lá" aria-pressed="false"></button>
    <button class="sw" data-color="#0A5BD6" style="background:#0A5BD6" title="Xanh dương" aria-label="Màu xanh dương" aria-pressed="false"></button>
    <button class="sw" data-color="#1B2229" style="background:#1B2229" title="Đen" aria-label="Màu đen" aria-pressed="false"></button>
  </div>
  <div class="group" id="widths">
    <button class="wd" data-w="1" title="Nét mỏng" aria-label="Nét mỏng" aria-pressed="false"><i style="height:2px"></i></button>
    <button class="wd" data-w="2" title="Nét vừa" aria-label="Nét vừa" aria-pressed="true"><i style="height:4px"></i></button>
    <button class="wd" data-w="3" title="Nét dày" aria-label="Nét dày" aria-pressed="false"><i style="height:7px"></i></button>
  </div>
  <div class="group">
    <button class="tool" id="undo" title="Hoàn tác (Ctrl+Z)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg><span class="lb">Hoàn tác</span></button>
    <button class="tool" id="clearAll" title="Xóa hết ghi chú"><span class="lb">Xóa hết</span></button>
  </div>
  <div class="spacer"></div>
  <button class="act" id="cancel" title="Esc">Hủy</button>
  <button class="act" id="copy" title="Ctrl+C">Chỉ chép ảnh</button>
  <button class="act" id="send" title="Ctrl+Enter">Dán vào chat</button>
</div>
<div class="hint" id="hint">Vẽ lên ảnh nếu cần, rồi bấm Dán vào chat (Ctrl+Enter). Không cần ghi chú thì bấm luôn.</div>
<div id="stage">
  <div id="wrap">
    <canvas id="cv" width="10" height="10" aria-label="Ảnh để ghi chú"></canvas>
    <div id="txt" contenteditable="true" spellcheck="false" aria-label="Nhập chữ ghi chú"></div>
  </div>
</div>
<script>
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const txt = document.getElementById('txt');
  const base = new Image();
  let shapes = [];
  let cur = null;
  let tool = 'arrow', color = '#E5251B', wLevel = 2, unit = 3;
  let textPos = null;

  app.on('editor:image', (d) => {
    document.title = 'Ghi chú lên ảnh – ' + (d.label || 'Ảnh');
    base.onload = () => {
      cv.width = base.naturalWidth;
      cv.height = base.naturalHeight;
      unit = Math.max(2, Math.round(Math.min(cv.width, cv.height) / 220));
      redraw();
    };
    base.src = d.url;
  });

  function lw(s) { return unit * (s.w === 1 ? 1 : s.w === 2 ? 2 : 3.5); }

  function drawShape(s) {
    ctx.save();
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = lw(s);
    const [x1, y1, x2, y2] = s.p || [];
    if (s.t === 'rect') {
      ctx.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
    } else if (s.t === 'ellipse') {
      ctx.beginPath();
      ctx.ellipse((x1 + x2) / 2, (y1 + y2) / 2, Math.abs(x2 - x1) / 2 || 1, Math.abs(y2 - y1) / 2 || 1, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (s.t === 'arrow') {
      const a = Math.atan2(y2 - y1, x2 - x1);
      const head = Math.max(lw(s) * 4, 12);
      ctx.beginPath(); ctx.moveTo(x1, y1);
      ctx.lineTo(x2 - Math.cos(a) * head * 0.6, y2 - Math.sin(a) * head * 0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - head * Math.cos(a - Math.PI / 7), y2 - head * Math.sin(a - Math.PI / 7));
      ctx.lineTo(x2 - head * Math.cos(a + Math.PI / 7), y2 - head * Math.sin(a + Math.PI / 7));
      ctx.closePath(); ctx.fill();
    } else if (s.t === 'pen' || s.t === 'mark') {
      if (s.t === 'mark') { ctx.globalAlpha = 0.38; ctx.lineWidth = lw(s) * 4; ctx.lineCap = 'butt'; }
      ctx.beginPath();
      s.pts.forEach((pt, i) => (i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1])));
      ctx.stroke();
    } else if (s.t === 'text') {
      const size = unit * (s.w === 1 ? 6 : s.w === 2 ? 8 : 11);
      ctx.font = '700 ' + size + 'px "Segoe UI", sans-serif';
      ctx.textBaseline = 'top';
      ctx.lineWidth = Math.max(2, size / 7);
      ctx.strokeStyle = '#FFFFFF';
      s.text.split('\n').forEach((line, i) => {
        ctx.strokeText(line, s.x, s.y + i * size * 1.25);
        ctx.fillText(line, s.x, s.y + i * size * 1.25);
      });
    }
    ctx.restore();
  }

  function redraw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (base.complete && base.naturalWidth) ctx.drawImage(base, 0, 0);
    shapes.forEach(drawShape);
    if (cur) drawShape(cur);
  }

  function pos(e) {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
  }

  cv.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (txt.style.display === 'block') { commitText(); return; }
    const [x, y] = pos(e);
    if (tool === 'text') { startText(e, x, y); return; }
    cv.setPointerCapture(e.pointerId);
    cur = (tool === 'pen' || tool === 'mark')
      ? { t: tool, color, w: wLevel, pts: [[x, y]] }
      : { t: tool, color, w: wLevel, p: [x, y, x, y] };
  });
  cv.addEventListener('pointermove', (e) => {
    if (!cur) return;
    const [x, y] = pos(e);
    if (cur.pts) cur.pts.push([x, y]); else { cur.p[2] = x; cur.p[3] = y; }
    redraw();
  });
  cv.addEventListener('pointerup', () => {
    if (!cur) return;
    const tiny = cur.p ? Math.hypot(cur.p[2] - cur.p[0], cur.p[3] - cur.p[1]) < 4 : cur.pts.length < 2;
    if (!tiny) shapes.push(cur);
    cur = null;
    redraw();
  });

  function startText(e, x, y) {
    const r = cv.getBoundingClientRect();
    const wr = document.getElementById('wrap').getBoundingClientRect();
    const scale = r.width / cv.width;
    const size = unit * (wLevel === 1 ? 6 : wLevel === 2 ? 8 : 11);
    textPos = { x, y };
    txt.style.left = (e.clientX - wr.left) + 'px';
    txt.style.top = (e.clientY - wr.top) + 'px';
    txt.style.fontSize = Math.max(12, size * scale) + 'px';
    txt.style.color = color;
    txt.textContent = '';
    txt.style.display = 'block';
    setTimeout(() => txt.focus(), 0);
  }
  function commitText() {
    const value = txt.innerText.replace(/\n+$/, '');
    txt.style.display = 'none';
    if (value.trim() && textPos) shapes.push({ t: 'text', color, w: wLevel, x: textPos.x, y: textPos.y, text: value });
    textPos = null;
    redraw();
  }
  txt.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); }
    if (e.key === 'Escape') { txt.style.display = 'none'; textPos = null; }
  });

  function select(groupId, attr, value) {
    document.querySelectorAll('#' + groupId + ' button').forEach((b) => b.setAttribute('aria-pressed', b.dataset[attr] === String(value)));
  }
  document.querySelectorAll('#tools button').forEach((b) => b.onclick = () => { tool = b.dataset.tool; select('tools', 'tool', tool); });
  document.querySelectorAll('#colors button').forEach((b) => b.onclick = () => { color = b.dataset.color; select('colors', 'color', color); });
  document.querySelectorAll('#widths button').forEach((b) => b.onclick = () => { wLevel = Number(b.dataset.w); select('widths', 'w', wLevel); });

  function undo() { shapes.pop(); redraw(); }
  document.getElementById('undo').onclick = undo;
  document.getElementById('clearAll').onclick = () => { shapes = []; redraw(); };

  function output() { if (txt.style.display === 'block') commitText(); return cv.toDataURL('image/png'); }
  document.getElementById('send').onclick = () => app.send('editor:send', output());
  document.getElementById('copy').onclick = () => app.send('editor:copy', output());
  document.getElementById('cancel').onclick = () => app.send('editor:cancel');

  const KEYS = { '1': 'arrow', '2': 'rect', '3': 'ellipse', '4': 'pen', '5': 'mark', '6': 'text' };
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); app.send('editor:send', output()); return; }
    if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); return; }
    if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) { e.preventDefault(); app.send('editor:copy', output()); return; }
    if (e.key === 'Escape') { app.send('editor:cancel'); return; }
    if (!e.ctrlKey && !e.altKey && KEYS[e.key]) { tool = KEYS[e.key]; select('tools', 'tool', tool); }
  });
</script>
</body>
</html>
