<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Chụp màn hình</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
  #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); pointer-events: none; }
  #sel {
    position: fixed; display: none; pointer-events: none;
    outline: 2px solid #4D9BFF; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
  }
  #size {
    position: absolute; left: 0; top: -28px; background: #0A5BD6; color: #FFFFFF;
    font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; white-space: nowrap;
  }
  #hint {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: #1B2229; color: #FFFFFF; font-size: 14px; padding: 10px 16px; border-radius: 8px;
    pointer-events: none;
  }
</style>
</head>
<body>
<img id="shot" alt="">
<div id="dim"></div>
<div id="sel"><span id="size"></span></div>
<div id="hint">Kéo chuột để chọn vùng cần chụp. Nhấn Esc hoặc chuột phải để hủy.</div>
<script>
  const shot = document.getElementById('shot');
  const dim = document.getElementById('dim');
  const sel = document.getElementById('sel');
  const size = document.getElementById('size');
  const hint = document.getElementById('hint');
  let start = null, rect = null;

  app.on('capture:image', (url) => { shot.src = url; });

  function draw(x1, y1, x2, y2) {
    const x = Math.min(x1, x2), y = Math.min(y1, y2);
    const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    rect = { x, y, w, h };
    sel.style.display = 'block';
    sel.style.left = x + 'px'; sel.style.top = y + 'px';
    sel.style.width = w + 'px'; sel.style.height = h + 'px';
    size.textContent = Math.round(w * devicePixelRatio) + ' × ' + Math.round(h * devicePixelRatio);
    size.style.top = y < 32 ? '4px' : '-28px';
    size.style.left = y < 32 ? '4px' : '0';
    dim.style.display = 'none';
    hint.style.display = 'none';
  }

  window.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    start = { x: e.clientX, y: e.clientY };
    draw(start.x, start.y, start.x, start.y);
  });
  window.addEventListener('mousemove', (e) => { if (start) draw(start.x, start.y, e.clientX, e.clientY); });
  window.addEventListener('mouseup', (e) => {
    if (e.button !== 0 || !start) return;
    start = null;
    if (rect && rect.w >= 4 && rect.h >= 4) app.send('capture:done', rect);
    else app.send('capture:cancel');
  });
  window.addEventListener('contextmenu', (e) => { e.preventDefault(); app.send('capture:cancel'); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') app.send('capture:cancel'); });
</script>
</body>
</html>
