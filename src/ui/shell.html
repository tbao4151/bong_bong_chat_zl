<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Zalo</title>
<style>
  html, body { margin: 0; height: 100%; background: #FFFFFF; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  header {
    height: 48px; box-sizing: border-box; background: #0A5BD6; color: #FFFFFF;
    display: flex; align-items: center; gap: 2px; padding: 0 4px 0 12px;
    -webkit-app-region: drag; user-select: none;
  }
  .info { display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.2; }
  .name { font-size: 14px; font-weight: 700; }
  #status { font-size: 12px; color: #DCE8FF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.toast { color: #FFFFFF; font-weight: 600; }
  button {
    -webkit-app-region: no-drag; width: 32px; height: 36px; flex-shrink: 0; border: none; border-radius: 8px;
    background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); }
  button:focus-visible { outline: 2px solid #FFB547; outline-offset: -2px; }
  button.on { background: rgba(255, 255, 255, 0.24); }
  .loading { padding: 24px; color: #5B6670; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="info">
    <span class="name">Zalo</span>
    <span id="status">Đang tải Zalo Web…</span>
  </div>
  <button id="men" aria-label="Tin nhắc tên tôi" title="Tin nhắc tên tôi" style="position: relative">
    <span style="font-weight: 800; font-size: 17px; line-height: 1">@</span>
    <span id="menBadge" hidden style="position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #FF8A3D; color: #1B2229; font-size: 11px; font-weight: 700; line-height: 16px; text-align: center"></span>
  </button>
  <button id="xls" aria-label="Gửi vùng Excel vừa copy" title="Gửi vùng Excel vừa copy">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16M15 4v16"></path></svg>
  </button>
  <button id="cap" aria-label="Chụp màn hình nhanh" title="Chụp màn hình nhanh">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><circle cx="12" cy="12" r="3"></circle></svg>
  </button>
  <button id="pin" aria-label="Giữ khung chat luôn mở" title="Giữ khung chat luôn mở">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 3h6l-1 6 3 4H7l3-4z"></path></svg>
  </button>
  <button id="more" aria-label="Thêm tùy chọn" title="Thêm tùy chọn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
  </button>
  <button id="expand" aria-label="Mở rộng: mở ứng dụng Zalo PC" title="Mở rộng: mở ứng dụng Zalo PC">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M9 21H3v-6"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path></svg>
  </button>
  <button id="min" aria-label="Thu gọn thành bong bóng" title="Thu gọn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
  </button>
</header>
<div class="loading">Đang tải Zalo Web…</div>
<script>
  const status = document.getElementById('status');
  const pin = document.getElementById('pin');
  const cap = document.getElementById('cap');
  let base = '';
  let toastTimer = null;

  document.getElementById('min').onclick = () => app.send('shell:min');
  document.getElementById('xls').onclick = () => app.send('shell:excel');
  document.getElementById('men').onclick = () => app.send('shell:mentions');
  document.getElementById('expand').onclick = () => app.send('shell:expand');
  document.getElementById('more').onclick = () => app.send('shell:menu');
  pin.onclick = () => app.send('shell:pin');
  cap.onclick = () => app.send('shell:capture');

  const MODE = { tag: 'Chỉ báo khi được tag', all: 'Báo mọi tin nhắn', off: 'Đã tắt thông báo' };

  app.on('shell:state', (s) => {
    base = (s.unread ? s.unread + ' tin chưa đọc, ' : '') + (MODE[s.mode] || '').toLowerCase();
    base = base.charAt(0).toUpperCase() + base.slice(1);
    if (!toastTimer) status.textContent = base;
    const mb = document.getElementById('menBadge');
    mb.hidden = !s.mentions;
    mb.textContent = s.mentions > 9 ? '9+' : String(s.mentions || '');
    document.getElementById('men').setAttribute('aria-label', 'Tin nhắc tên tôi' + (s.mentions ? ', ' + s.mentions + ' chưa xem' : ''));
    pin.classList.toggle('on', !!s.pinned);
    pin.setAttribute('aria-pressed', s.pinned ? 'true' : 'false');
    cap.title = 'Chụp màn hình nhanh' + (s.captureKey ? ' (' + s.captureKey + ')' : '');
    document.getElementById('xls').title = 'Gửi vùng Excel vừa copy' + (s.excelKey ? ' (' + s.excelKey + ')' : '');
  });

  app.on('shell:toast', (t) => {
    clearTimeout(toastTimer);
    status.textContent = t.text;
    status.title = t.text;
    status.classList.add('toast');
    toastTimer = setTimeout(() => {
      toastTimer = null;
      status.classList.remove('toast');
      status.textContent = base;
      status.title = '';
    }, t.ms || 5000);
  });
</script>
</body>
</html>
